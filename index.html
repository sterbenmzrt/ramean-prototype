<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ramean.id — Langganan Premium, Harga Terjangkau</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      font-family:'Inter', sans-serif;
      color:#0D1B35;
      background:#FAFAF9;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    button { font-family:inherit; }
    input::placeholder { color:#B6BECC; }
    input:focus { border-color:#1B3C78 !important; box-shadow:0 0 0 3px rgba(27,60,120,0.12); }
    ::-webkit-scrollbar { width:11px; height:11px; }
    ::-webkit-scrollbar-track { background:#F1F5F9; }
    ::-webkit-scrollbar-thumb { background:#CBD5E0; border-radius:6px; border:2px solid #F1F5F9; }
    ::-webkit-scrollbar-thumb:hover { background:#94A3B8; }

    /* Page transition */
    @keyframes pageIn {
      from { opacity:0; transform:translateY(10px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .page-anim { animation:pageIn 0.4s cubic-bezier(0.16,1,0.3,1); }
  </style>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" rx="20" fill="#1B3C78"/>
      <text x="50" y="68" font-family="sans-serif" font-size="52" font-weight="800" fill="#F5C962" text-anchor="middle">R</text>
    </svg>
  </template>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="components/shared.jsx"></script>
  <script type="text/babel" src="components/LandingPage.jsx"></script>
  <script type="text/babel" src="components/Pages.jsx"></script>
  <script type="text/babel" src="components/DetailPage.jsx"></script>
  <script type="text/babel" src="components/CheckoutPage.jsx"></script>

  <script type="text/babel">
    const { NavBar, Footer, LandingPage, CatalogPage, DetailPage, CheckoutPage, AuthPage, DashboardPage } = window;

    function App() {
      const [page, setPage]   = React.useState('landing');
      const [svcId, setSvcId] = React.useState('netflix');
      const [loggedIn, setLoggedIn] = React.useState(false);
      const [key, setKey] = React.useState(0);

      const nav = (pg, id) => {
        if (id) setSvcId(id);
        setPage(pg);
        setKey(k => k + 1);
        window.scrollTo({ top:0, behavior:'instant' });
      };

      const showChrome = page !== 'auth';

      return (
        <div>
          {showChrome && <NavBar page={page} nav={nav} loggedIn={loggedIn} />}
          <div className="page-anim" key={key}>
            {page === 'landing'   && <LandingPage nav={nav} />}
            {page === 'catalog'   && <CatalogPage nav={nav} />}
            {page === 'detail'    && <DetailPage nav={nav} svcId={svcId} />}
            {page === 'checkout'  && <CheckoutPage nav={nav} svcId={svcId} />}
            {page === 'auth'      && <AuthPage nav={nav} onLogin={() => { setLoggedIn(true); nav('dashboard'); }} />}
            {page === 'dashboard' && <DashboardPage nav={nav} />}
          </div>
          {showChrome && <Footer nav={nav} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
